name = "wayfinder"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# GEMI_API_KEY is a secret: `wrangler secret put GEMI_API_KEY`. It is never in this file.
[vars]
GEMI_BASE = "https://opendata-api.businessportal.gr/api/opendata/v1"
REFRESH_AFTER_DAYS = "30"
# GEMI allows 8 requests/minute for the whole key. 10.1s between calls is ~5.9.
MIN_GAP_MS = "10100"

# Per-client cap on lookups. Each lookup can queue a GEMI call on the single
# global budget above, so one client must not be able to fill the queue.
# Keep `limit` in sync with LOOKUPS_PER_MINUTE in test/ratelimit.test.ts.
[[ratelimits]]
name = "LOOKUPS"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "wayfinder"
database_id = "995848b8-3927-4a69-9618-080d9c7d1b9e"

[[durable_objects.bindings]]
name = "DISPATCHER"
class_name = "GemiDispatcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GemiDispatcher"]
